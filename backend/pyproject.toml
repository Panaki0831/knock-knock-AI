[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knock-knock-ai"
version = "0.1.0"
description = "AI Content Marketing Automation Platform for knock knock AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "anthropic>=0.40.0",
    "openai>=1.55.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "pinecone-client>=5.0.0",
    "httpx>=0.28.0",
    "tavily-python>=0.5.0",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "tiktoken>=0.8.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.17",
    "python-pptx>=1.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
